[project]
name = "slurm-helper-scripts"
version = "1.1.0"
description = "Tools to generate Slurm resource utilization reports and check node availability."
authors = [
    { name = "Chuen Hei TAI", email = "chtaihei@ust.hk" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
squota = "slurm_helper_scripts.squota:run"
savail = "slurm_helper_scripts.savail:run"

[build-system]
requires = ["setuptools>=77.0"] 
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false